.answer{

}

.answer h2{
  font-size:20px;
  margin:20px 0 8px;
}

.answer h3{
  font-size:17px;
  margin:16px 0 6px;
}

.answer ul{
  padding-left:24px;
}

.answer mjx-container{
  font-size:1.05em;
}

.answer mjx-container[display="true"]{

  overflow-y:hidden;
}

.step{

  padding:11px 12px;
  border-radius:0 12px 12px 0;
  margin:8px 0;
}

.study-table-wrap{
  width:100%;
  overflow-x:auto;
  margin:14px 0;
}

.study-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  background:white;
}

.study-table th,
.study-table td{
  border:1px solid #cbd6e2;
  padding:9px 8px;
  text-align:center;
  vertical-align:middle;
}

.study-table th{

<p>
Board-style Answer • Gujarati • Maths Steps • Exploding View
</p>

</header>

<main>

<!-- SUBJECT -->

<div class="card">

<div class="row">

<div>

<label>📘 વિષય</label>

<select id="subject">

<option value="ગણિત">ગણિત</option>

<option value="વિજ્ઞાન">વિજ્ઞાન</option>

સામાજિક વિજ્ઞાન
</option>

<option value="ગુજરાતી">ગુજરાતી</option>

<option value="અંગ્રેજી">અંગ્રેજી</option>

<option value="સંસ્કૃત">સંસ્કૃત</option>

<option value="અન્ય">અન્ય</option>

</select>

id="question"
placeholder="ઉદાહરણ: પ્રકાશસંશ્લેષણ એટલે શું? અથવા ગણિતનો દાખલો લખો..."
></textarea>

<div style="height:10px"></div>

<label>📷 પ્રશ્નનો ફોટો / Screenshot</label>

<div class="drop">

<div class="actions" style="margin-bottom:10px">

<button
type="button"
class="btn secondary"
id="galleryBtn"
>
🖼️ Galleryમાંથી ફોટો લો
</button>

<button
type="button"
class="btn secondary"
id="cameraBtn"
>
📷 Cameraથી ફોટો લો
</button>

</div>

<input
id="photo"
type="file"
accept="image/*"
style="display:none"
>

id="cameraPhoto"
type="file"
accept="image/*"
capture="environment"
style="display:none"
>

<div class="small">

Galleryમાં પહેલેથી રહેલો screenshot/photo પસંદ કરી શકશો.

Cameraથી નવો ફોટો પણ લઈ શકશો.

</div>

<img
id="preview"
class="preview"
alt="Question preview"
>

</div>

</div>


<!-- BUTTONS -->

<div class="card">

<div class="actions">

<button
class="btn primary"
id="answerBtn"
>
🚀 જવાબ બનાવો
</button>

<button
class="btn secondary"
id="clearBtn"
>
🧹 Clear
</button>

</div>

<div
id="status"
class="status"
style="margin-top:10px"
>
</div>

<div
id="usage"
class="usage"
>
</div>

</div>


<!-- RESULT -->

<div
id="result"
class="card answer"
style="display:none"
>
</div>


<footer>

GSEB official Question Bank / syllabus સાથે final cross-check કરવો.

</main>


<script>

const $ = id => document.getElementById(id);

const photo = $("photo");

const cameraPhoto = $("cameraPhoto");

const preview = $("preview");

const status = $("status");

const usage = $("usage");

const result = $("result");

const answerBtn = $("answerBtn");


// ------------------------------------------
// PHOTO BUTTONS
// ------------------------------------------

$("galleryBtn").addEventListener(
  "click",
  () => photo.click()
);

$("cameraBtn").addEventListener(
  "click",
  () => cameraPhoto.click()
);


// ------------------------------------------
// SELECT IMAGE
// ------------------------------------------

function useSelectedFile(input){

  const file = input.files?.[0];

  if(!file){
    return;
  }

  const dataTransfer = new DataTransfer();

  dataTransfer.items.add(file);

  photo.files = dataTransfer.files;

  preview.src = URL.createObjectURL(file);

  preview.style.display = "block";
}


// Gallery

photo.addEventListener(
  "change",
  () => useSelectedFile(photo)
);


// Camera

cameraPhoto.addEventListener(
  "change",
  () => useSelectedFile(cameraPhoto)
);


// ------------------------------------------
// STATUS
// ------------------------------------------

function setStatus(message, isError=false){

  status.textContent = message;

  status.classList.toggle(
    "error",
    isError
  );

  status.style.display = "block";
}


// ------------------------------------------
// MARKDOWN RENDERER
// ------------------------------------------

function escapeHtml(text){

  return text.replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function renderMarkdown(md){

  let text = escapeHtml(md);

  const lines = text.split("\n");

  let output = [];

  let i = 0;


  const isTableLine = line => {

    const t = line.trim();

    return (
      t.startsWith("|") &&
      t.endsWith("|") &&
      t.split("|").length >= 3
    );

  };


  const isSeparator = line => {

    if(!isTableLine(line)){
      return false;
    }

    return line
      .trim()
      .slice(1,-1)
      .split("|")
      .every(
        cell => /^:?-{3,}:?$/.test(cell.trim())
      );

  };


  while(i < lines.length){

    if(
      isTableLine(lines[i]) &&
      i + 1 < lines.length &&
      isSeparator(lines[i+1])
    ){

      const getCells = line =>
        line
          .trim()
          .slice(1,-1)
          .split("|")
          .map(cell => cell.trim());


      const header = getCells(lines[i]);

      i += 2;

      const rows = [];


      while(
        i < lines.length &&
        isTableLine(lines[i])
      ){

        rows.push(
          getCells(lines[i])
        );

        i++;

      }


      let table =
        '<div class="study-table-wrap">' +
        '<table class="study-table">' +
        '<thead><tr>';


      header.forEach(cell => {

        table +=
          "<th>" +
          cell +
          "</th>";

      });


      table +=
        "</tr></thead><tbody>";


      rows.forEach(row => {

        table += "<tr>";


        for(
          let j = 0;
          j < header.length;
          j++
        ){

          table +=
            "<td>" +
            (row[j] || "") +
            "</td>";

        }


        table += "</tr>";

      });


      table +=
        "</tbody></table></div>";


      output.push(table);

      continue;

    }


    output.push(lines[i]);

    i++;

  }


  text = output.join("\n");


  // Headings

  text = text.replace(
    /^### (.*)$/gm,
    "<h3>$1</h3>"
  );

  text = text.replace(
    /^## (.*)$/gm,
    "<h2>$1</h2>"
  );

  text = text.replace(
    /^# (.*)$/gm,
    "<h2>$1</h2>"
  );


  // Bold

  text = text.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );


  // Bullet points

  text = text.replace(
    /^\s*[-•] (.*)$/gm,
    "<li>$1</li>"
  );


  text = text.replace(
    /(<li>.*<\/li>\n?)+/g,
    match => "<ul>" + match + "</ul>"
  );


  // Numbered steps

  text = text.replace(
    /^\s*(\d+)\.\s+(.*)$/gm,
    '<div class="step"><strong>Step $1:</strong> $2</div>'
  );


  return text
    .replace(/\n{2,}/g, "<br><br>")
    .replace(/\n/g, "<br>");

}


// ------------------------------------------
// GENERATE ANSWER
// ------------------------------------------

async function generateAnswer(){

  const question =
    $("question").value.trim();

  const file =
    photo.files?.[0];

  const subject =
    $("subject").value;

  const marks =
    $("marks").value;


  if(!question && !file){

    alert(
      "પહેલા પ્રશ્ન લખો અથવા ફોટો પસંદ કરો."
    );

    return;

  }


  // ----------------------------------------
  // UI LOCK
  // ----------------------------------------

  answerBtn.disabled = true;

  answerBtn.textContent =
    "⏳ જવાબ બની રહ્યો છે...";


  result.style.display = "none";

  usage.style.display = "none";


  setStatus(
    "⏳ પ્રશ્ન વાંચી રહ્યો છું અને GSEB-style જવાબ બનાવી રહ્યો છું..."
  );


  try{

    // --------------------------------------
    // FORM DATA
    // --------------------------------------

    const formData = new FormData();


    formData.append(
      "question",
      question
    );


    formData.append(
      "subject",
      subject
    );


    formData.append(
      "marks",
      marks
    );


    if(file){

      formData.append(
        "image",
        file
      );

    }


    // --------------------------------------
    // RENDER SERVER
    // --------------------------------------

    const response = await fetch(
      "/api/solve",
      {
        method:"POST",
        body:formData
      }
    );


    const data =
      await response.json();


    // --------------------------------------
    // ERROR
    // --------------------------------------

    if(!response.ok){

      throw new Error(
        data?.error ||
        "Server error આવ્યો."
      );

    }


    // --------------------------------------
    // ANSWER
    // --------------------------------------

    const answer =
      data?.answer ||
      "જવાબ મળ્યો નથી.";


    result.innerHTML =
      renderMarkdown(answer);


    result.style.display =
      "block";


    // --------------------------------------
    // USAGE
    // --------------------------------------

    if(data?.usage){

      usage.textContent =
        "📊 આજે ઉપયોગ: " +
        data.usage.usedToday +
        " / " +
        data.usage.dailyLimit +
        " પ્રશ્નો • બાકી: " +
        data.usage.remainingToday;


      usage.style.display =
        "block";

    }


    status.style.display =
      "none";


    // --------------------------------------
    // MATHJAX
    // --------------------------------------

    if(
      window.MathJax &&
      MathJax.typesetPromise
    ){

      try{

        await MathJax.typesetPromise(
          [result]
        );

      }catch(error){

        console.warn(
          "MathJax error:",
          error
        );

      }

    }


    // Result ઉપર scroll

    result.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


  }catch(error){

    console.error(error);


    setStatus(
      "❌ " +
      error.message +
      " — થોડા સમય પછી ફરી પ્રયાસ કરો.",
      true
    );

  }finally{

    answerBtn.disabled =
      false;

    answerBtn.textContent =
      "🚀 જવાબ બનાવો";

  }

}


// ------------------------------------------
// CLEAR
// ------------------------------------------

$("clearBtn").onclick = () => {

  $("question").value = "";

  photo.value = "";

  cameraPhoto.value = "";

  preview.src = "";

  preview.style.display =
    "none";

  result.innerHTML = "";

  result.style.display =
    "none";

  status.style.display =
    "none";

  usage.style.display =
    "none";

};


// ------------------------------------------
// ANSWER BUTTON
// ------------------------------------------

answerBtn.onclick =
  generateAnswer;

</script>

</body>
